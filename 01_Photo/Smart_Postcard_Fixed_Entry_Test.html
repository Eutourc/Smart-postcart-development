<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Smart Postcard · 固定入口独立实验</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fff;color:#174da3;font-family:system-ui,-apple-system,'Microsoft YaHei',sans-serif}main{max-width:520px;margin:12vh auto 0;padding:25px;text-align:center}h1{font-size:23px;color:#614915}p{font-size:17px;line-height:1.75}button{font:inherit;font-size:17px;border:1px solid #b99746;background:#f5d57b;border-radius:25px;padding:12px 24px;margin:8px;cursor:pointer}button:disabled{opacity:.5}small{display:block;color:#666;line-height:1.7;margin-top:18px}#version{font-weight:bold;font-size:22px;color:#146c3e}
</style>
</head>
<body><main>
<h1>固定入口 · 独立实验</h1>
<p id="status" role="status">正在核对照片模块与制作平台的配套版本……</p>
<p id="version"></p>
<button id="open" hidden>打开已核对版本</button>
<button id="retry" hidden>重新检查</button>
<small>本页面只读取仓库文件名，不修改任何旧文件。打开版本前会等待您确认。</small>
</main>
<script>
(()=>{'use strict';
const repo='Eutourc/Smart-postcart-development',api='https://api.github.com/repos/'+repo+'/contents/';
const status=document.getElementById('status'),version=document.getElementById('version'),open=document.getElementById('open'),retry=document.getElementById('retry');
let target='';
async function list(path){
const r=await fetch(api+path+'?check='+Date.now(),{cache:'no-store',headers:{Accept:'application/vnd.github+json'}});
if(!r.ok)throw new Error(r.status===403?'GitHub 接口暂时限制访问（403）':'GitHub 查询失败（'+r.status+'）');
const a=await r.json();if(!Array.isArray(a))throw new Error('未取得文件目录');return a.filter(x=>x.type==='file').map(x=>x.name);
}
async function check(){open.hidden=true;retry.hidden=true;version.textContent='';status.textContent='正在核对照片模块与制作平台的配套版本……';
try{const [photos,makers]=await Promise.all([list('01_Photo'),list('02B_Center')]);
const matches=photos.map(x=>/^V(\d+)\.html$/i.exec(x)).filter(Boolean).map(m=>Number(m[1])).filter(n=>makers.includes('cn_make_v8.0_V'+n+'.html')).sort((a,b)=>b-a);
if(!matches.length)throw new Error('没有发现同编号的照片与制作平台文件');
const n=matches[0];target='./V'+n+'.html?entry='+Date.now();version.textContent='已找到 V'+n+'（两端文件名匹配）';status.textContent='入口检测成功。点击下面按钮即可打开照片模块。';open.hidden=false;retry.hidden=false;
}catch(e){status.textContent='本次检测未成功：'+e.message;retry.hidden=false;}}
open.addEventListener('click',()=>{if(target)location.assign(target)});retry.addEventListener('click',check);check();
})();
</script></body></html>
