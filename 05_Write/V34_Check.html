<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V34 部署文件核对</title><style>body{font:18px/1.6 system-ui,sans-serif;max-width:680px;margin:auto;padding:22px;color:#253348}h2{font-size:23px}section{border:1px solid #ddd;border-radius:12px;padding:16px;margin:14px 0}button{font:inherit;padding:12px;border-radius:12px;background:#f8d66a;border:1px solid #b68a27}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px}strong{color:#174a83}</style><h2>V34 部署一致性核对</h2><p>本工具只读取文件，不修改、不清除任何内容。它分别读取 GitHub 仓库原始文件和 GitHub Pages 文件，与交付的 V34 原件进行 SHA-256 比对。</p><button id="go">开始核对</button><section id="a">仓库原始文件：等待</section><section id="b">GitHub Pages 文件：等待</section><section><strong>交付的 V34 原件</strong><pre>大小：7,784,140 字节
SHA-256：61eb44bb2574b6adca88813c8033ad740f68ebc5920d20c58e01963e5b36378c</pre></section><script>const expected='61eb44bb2574b6adca88813c8033ad740f68ebc5920d20c58e01963e5b36378c';const urls=[['a','https://raw.githubusercontent.com/Eutourc/Smart-postcart-development/main/05_Write/Smart_Postcard_Writing_V8-34.html'],['b','https://eutourc.github.io/Smart-postcart-development/05_Write/Smart_Postcard_Writing_V8-34.html']];async function check(id,url){let e=document.getElementById(id);e.textContent='正在读取……';try{let r=await fetch(url+'?check='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);let b=await r.arrayBuffer();let h=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',b))).map(x=>x.toString(16).padStart(2,'0')).join('');e.innerHTML='<strong>'+ (id==='a'?'仓库原始文件':'GitHub Pages 文件')+'</strong><pre>HTTP: '+r.status+'\n大小：'+b.byteLength+' 字节\nSHA-256：'+h+'\n结论：'+(h===expected?'与交付 V34 完全一致':'与交付 V34 不一致')+'</pre>'}catch(err){e.textContent=(id==='a'?'仓库原始文件':'GitHub Pages 文件')+'：无法读取（'+err.message+'）。可能受跨域限制；这不代表文件不一致。'}}document.getElementById('go').onclick=()=>{urls.forEach(([id,url])=>check(id,url))};</script></html>
